name: Deploy Full Stack to Production

on:
    push:
        branches: [deploy]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy Full Stack to Production
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/deploy'
        container:
            image: adbsoftwaresolutions/ansible-runner:latest
            options: --user root
            env:
                HOME: /root

        steps:
            - name: Checkout deploy repo
              uses: actions/checkout@v3
              with:
                  repository: adb-software-solutions/adb-deploy
                  token: ${{ secrets.DEPLOY_REPO_PAT }}

            - name: Set up SSH
              run: |
                  mkdir -p /root/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > /root/.ssh/id_ed25519
                  chmod 600 /root/.ssh/id_ed25519
                  ssh-keyscan -p 1999 206.189.28.66 >> /root/.ssh/known_hosts

            - name: Install Ansible Collections
              run: ansible-galaxy collection install -r requirements.yml

            - name: Deploy full stack
              run: |
                  ansible-playbook site.yml -i inventories/production/hosts.ini \
                    --extra-vars "site=weddingofrebeccaandpeter-website" \
                    --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                    --extra-vars "weddingofrebeccaandpeter_backend_secret_key=${{ secrets.WEDDINGOFREBECCAANDPETER_BACKEND_SECRET_KEY }}" \
                    --extra-vars "weddingofrebeccaandpeter_db_name=${{ secrets.WEDDINGOFREBECCAANDPETER_DB_NAME }}" \
                    --extra-vars "weddingofrebeccaandpeter_db_user=${{ secrets.WEDDINGOFREBECCAANDPETER_DB_USER }}" \
                    --extra-vars "weddingofrebeccaandpeter_db_password=${{ secrets.WEDDINGOFREBECCAANDPETER_DB_PASSWORD }}" \
                    --extra-vars "weddingofrebeccaandpeter_photo_upload_password=${{ secrets.WEDDINGOFREBECCAANDPETER_PHOTO_UPLOAD_PASSWORD }}"
