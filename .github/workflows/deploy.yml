name: Deploy Full Stack to Production

on:
    push:
        branches: [deploy]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy Full Stack to Production
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/deploy'
        container:
            image: adbsoftwaresolutions/ansible-runner:latest
            options: --user root
            env:
                HOME: /root

        steps:
            - name: Checkout deploy repo
              uses: actions/checkout@v3
              with:
                  repository: adb-software-solutions/adb-deploy
                  token: ${{ secrets.DEPLOY_REPO_PAT }}

            - name: Set up SSH
              run: |
                  mkdir -p /root/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > /root/.ssh/id_ed25519
                  chmod 600 /root/.ssh/id_ed25519
                  ssh-keyscan -p 1999 206.189.28.66 >> /root/.ssh/known_hosts

            - name: Install Ansible Collections
              run: ansible-galaxy collection install -r requirements.yml

            - name: Deploy full stack
              run: |
                  ansible-playbook site.yml -i inventories/production/hosts.ini \
                    --extra-vars "site=techwiki-website" \
                    --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                    --extra-vars "techwiki_backend_secret_key=${{ secrets.techwiki_BACKEND_SECRET_KEY }}" \
                    --extra-vars "techwiki_db_name=${{ secrets.techwiki_DB_NAME }}" \
                    --extra-vars "techwiki_db_user=${{ secrets.techwiki_DB_USER }}" \
                    --extra-vars "techwiki_db_password=${{ secrets.techwiki_DB_PASSWORD }}" \
                    --extra-vars "techwiki_microsoft_graph_tenant_id=${{ secrets.techwiki_MICROSOFT_GRAPH_TENANT_ID }}" \
                    --extra-vars "techwiki_microsoft_graph_client_id=${{ secrets.techwiki_MICROSOFT_GRAPH_CLIENT_ID }}" \
                    --extra-vars "techwiki_microsoft_graph_sender_email=${{ secrets.techwiki_MICROSOFT_GRAPH_SENDER_EMAIL }}" \
                    --extra-vars "techwiki_microsoft_graph_certificate_base64=${{ secrets.techwiki_MICROSOFT_GRAPH_CERTIFICATE_BASE64 }}" \
                    --extra-vars "techwiki_microsoft_private_key_base64=${{ secrets.techwiki_MICROSOFT_PRIVATE_KEY_BASE64 }}" \
