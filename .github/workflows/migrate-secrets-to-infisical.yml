name: Migrate GitHub secrets to Infisical

on:
  workflow_dispatch:
    inputs:
      identity_id:
        description: Infisical migration machine identity ID
        required: true
        type: string
      app_project_id:
        description: Infisical application project ID
        required: true
        type: string
      ci_project_id:
        description: Infisical CI project ID
        required: true
        type: string
      confirm:
        description: Type MIGRATE to continue
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    env:
      INFISICAL_API_URL: https://secrets.adbsoftwaresolutions.co.uk
      APP_PROJECT_ID: ${{ inputs.app_project_id }}
      CI_PROJECT_ID: ${{ inputs.ci_project_id }}
      GH_BACKEND_SECRET_KEY: ${{ secrets.techwiki_BACKEND_SECRET_KEY }}
      GH_DB_NAME: ${{ secrets.techwiki_DB_NAME }}
      GH_DB_USER: ${{ secrets.techwiki_DB_USER }}
      GH_DB_PASSWORD: ${{ secrets.techwiki_DB_PASSWORD }}
      GH_MICROSOFT_GRAPH_TENANT_ID: ${{ secrets.techwiki_MICROSOFT_GRAPH_TENANT_ID }}
      GH_MICROSOFT_GRAPH_CLIENT_ID: ${{ secrets.techwiki_MICROSOFT_GRAPH_CLIENT_ID }}
      GH_MICROSOFT_GRAPH_SENDER_EMAIL: ${{ secrets.techwiki_MICROSOFT_GRAPH_SENDER_EMAIL }}
      GH_MICROSOFT_GRAPH_CERTIFICATE_BASE64: ${{ secrets.techwiki_MICROSOFT_GRAPH_CERTIFICATE_BASE64 }}
      GH_MICROSOFT_GRAPH_PRIVATE_KEY_BASE64: ${{ secrets.techwiki_MICROSOFT_PRIVATE_KEY_BASE64 }}
      GH_NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      GH_NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      GH_NEXT_PUBLIC_ADSENSE_BANNER_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_BANNER_SLOT }}
      GH_NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT }}
      GH_NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT }}
      GH_NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      GH_NEXT_PUBLIC_AUTH_URL: ${{ secrets.NEXT_PUBLIC_AUTH_URL }}
      GH_VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
      GH_VITE_API_URL: ${{ secrets.VITE_API_URL }}
      GH_VITE_AUTH_URL: ${{ secrets.VITE_AUTH_URL }}
      GH_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" --data-urlencode "audience=https://github.com/adb-software-solutions" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "identityId=${{ inputs.identity_id }}" --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          echo "INFISICAL_TOKEN=${access_token}" >> "${GITHUB_ENV}"

      - name: Copy current GitHub values to Infisical
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          app_file="$(mktemp)"
          ci_file="$(mktemp)"
          trap 'rm -f "${app_file}" "${ci_file}"' EXIT

          add_if_set() {
            local file="$1" key="$2" value="$3"
            if [[ -n "${value}" ]]; then
              printf '%s=%s\n' "${key}" "${value}" >> "${file}"
            else
              echo "::warning::Skipping ${key}: current GitHub value is empty or unavailable."
            fi
          }

          add_if_set "${app_file}" BACKEND_SECRET_KEY "${GH_BACKEND_SECRET_KEY}"
          add_if_set "${app_file}" DB_NAME "${GH_DB_NAME}"
          add_if_set "${app_file}" DB_USER "${GH_DB_USER}"
          add_if_set "${app_file}" DB_PASSWORD "${GH_DB_PASSWORD}"
          add_if_set "${app_file}" MICROSOFT_GRAPH_TENANT_ID "${GH_MICROSOFT_GRAPH_TENANT_ID}"
          add_if_set "${app_file}" MICROSOFT_GRAPH_CLIENT_ID "${GH_MICROSOFT_GRAPH_CLIENT_ID}"
          add_if_set "${app_file}" MICROSOFT_GRAPH_SENDER_EMAIL "${GH_MICROSOFT_GRAPH_SENDER_EMAIL}"
          add_if_set "${app_file}" MICROSOFT_GRAPH_CERTIFICATE_BASE64 "${GH_MICROSOFT_GRAPH_CERTIFICATE_BASE64}"
          add_if_set "${app_file}" MICROSOFT_GRAPH_PRIVATE_KEY_BASE64 "${GH_MICROSOFT_GRAPH_PRIVATE_KEY_BASE64}"
          add_if_set "${app_file}" NEXT_PUBLIC_GA_MEASUREMENT_ID "${GH_NEXT_PUBLIC_GA_MEASUREMENT_ID}"
          add_if_set "${app_file}" NEXT_PUBLIC_ADSENSE_CLIENT_ID "${GH_NEXT_PUBLIC_ADSENSE_CLIENT_ID}"
          add_if_set "${app_file}" NEXT_PUBLIC_ADSENSE_BANNER_SLOT "${GH_NEXT_PUBLIC_ADSENSE_BANNER_SLOT}"
          add_if_set "${app_file}" NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT "${GH_NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT}"
          add_if_set "${app_file}" NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT "${GH_NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT}"
          add_if_set "${app_file}" NEXT_PUBLIC_API_URL "${GH_NEXT_PUBLIC_API_URL}"
          add_if_set "${app_file}" NEXT_PUBLIC_AUTH_URL "${GH_NEXT_PUBLIC_AUTH_URL}"
          add_if_set "${app_file}" VITE_APP_URL "${GH_VITE_APP_URL}"
          add_if_set "${app_file}" VITE_API_URL "${GH_VITE_API_URL}"
          add_if_set "${app_file}" VITE_AUTH_URL "${GH_VITE_AUTH_URL}"

          add_if_set "${ci_file}" NEXT_PUBLIC_GA_MEASUREMENT_ID "${GH_NEXT_PUBLIC_GA_MEASUREMENT_ID}"
          add_if_set "${ci_file}" NEXT_PUBLIC_ADSENSE_CLIENT_ID "${GH_NEXT_PUBLIC_ADSENSE_CLIENT_ID}"
          add_if_set "${ci_file}" NEXT_PUBLIC_ADSENSE_BANNER_SLOT "${GH_NEXT_PUBLIC_ADSENSE_BANNER_SLOT}"
          add_if_set "${ci_file}" NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT "${GH_NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT}"
          add_if_set "${ci_file}" NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT "${GH_NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT}"
          add_if_set "${ci_file}" CODECOV_TOKEN "${GH_CODECOV_TOKEN}"

          infisical secrets set --file="${app_file}" --projectId="${APP_PROJECT_ID}" --env=prod --path=/ >/dev/null
          infisical secrets set --file="${ci_file}" --projectId="${CI_PROJECT_ID}" --env=dev --path=/ >/dev/null
          echo "Migration complete."
