<!doctype html>
<html lang="en">
    <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
        <div style="max-width:600px;margin:0 auto;padding:40px 20px">
            <div style="background:#fff;border-radius:12px;padding:32px">
                <h1 style="margin-top:0">Verify your TechWiki email</h1>
                <p>Hi {{ first_name }},</p>
                <p>Confirm that this email address belongs to you before signing in to TechWiki.</p>
                <p style="margin:28px 0">
                    <a href="{{ verification_url }}" style="background:#2563eb;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;display:inline-block">Verify email address</a>
                </p>
                <p style="font-size:13px;color:#64748b">If you did not create this account, you can ignore this message.</p>
            </div>
        </div>
    </body>
</html>
